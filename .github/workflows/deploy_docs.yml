name: Deploy Docs

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:

  deploy:

    name: Deploy Docs

    runs-on: ubuntu-latest

    steps:

      - 
        name: Checkout
        uses: actions/checkout@v7

      - 
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - 
        name: Regenerate the Sass API reference (doc/sass)
        run: |
          npm ci --ignore-scripts
          npm run docs:scss:release

      - 
        name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - 
        name: PIP Install mkdocs-material
        run: |
          pip install mkdocs-material

      - 
        name: PIP Install mkdocstrings
        run: |
          pip install "mkdocstrings[python]>=0.18"

      - 
        name: MKDocs Deploy
        run: |
          mkdocs gh-deploy --force