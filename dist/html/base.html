<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>unit.gl Test Page</title>
    <link rel="stylesheet" href="/css/unit.gl.css" />

    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 2rem;
            background: #fff;
            color: #000;
            max-width: 64rem;
            padding: 2rem;
            margin: 0 auto;
        }



        section {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            margin-bottom: 1rem;
            border-bottom: 1px solid #ddd;
        }

        .scale-demo {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .scale-line {
            background: #f9f9f9;
            border-left: 4px solid #eee;
            padding: 0.75rem 1rem;
            position: relative;
        }

        .scale-line::before {
            content: attr(data-label);
            position: absolute;
            left: 0.5rem;
            top: 0.5rem;
            font-size: 12px;
            color: #aaa;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            background: #e0e0e0;
            color: #444;
            padding: 0.2rem 0.4rem;
            margin-left: 0.5rem;
            border-radius: 0.25rem;
        }



        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            margin-bottom: 0.75rem;
        }

        a {
            color: #007acc;
            text-decoration: none;
            border-bottom: 1px dotted #007acc;
        }

        a:hover {
            text-decoration: underline;
        }

        .tag {
            font-size: 0.75rem;
            background: #e0e0e0;
            color: #444;
            padding: 0.2rem 0.4rem;
            margin-left: 0.5rem;
            border-radius: 0.25rem;
        }
    </style>

</head>

<body>

    <h1>unit.gl Test</h1>

    <p>Replace this with your test content.</p>

</body>

</html>
