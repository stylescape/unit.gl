<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layering System Demo | unit.gl</title>
    <link rel="stylesheet" href="/css/unit.gl.css" />
    <script type="module" src="/js/unit.gl.js"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            font-size: 1rem;
            line-height: 1.25rem;
            padding: 2rem;
            background: #fff;
            color: #000;
            max-width: 64rem;
            margin: 0 auto;
        }



        section {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            margin-bottom: 1rem;
            border-bottom: 1px solid #ddd;
        }

        .scale-demo {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .scale-line {
            background: #f9f9f9;
            border-left: 4px solid #eee;
            padding: 0.75rem 1rem;
            position: relative;
        }

        .scale-line::before {
            content: attr(data-label);
            position: absolute;
            left: 0.5rem;
            top: 0.5rem;
            font-size: 12px;
            color: #aaa;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            background: #e0e0e0;
            color: #444;
            padding: 0.2rem 0.4rem;
            margin-left: 0.5rem;
            border-radius: 0.25rem;
        }



        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            margin-bottom: 0.75rem;
        }

        a {
            color: #007acc;
            text-decoration: none;
            border-bottom: 1px dotted #007acc;
        }

        a:hover {
            text-decoration: underline;
        }

        .tag {
            font-size: 0.75rem;
            background: #e0e0e0;
            color: #444;
            padding: 0.2rem 0.4rem;
            margin-left: 0.5rem;
            border-radius: 0.25rem;
        }

        .demo-container {
            display: grid;
            grid_template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .demo-box {
            position: relative;
            background: #f8f8f8;
            border: 1px solid #ccc;
            font-family: sans-serif;
            overflow: hidden;
        }


        .demo-box::after {
            content: attr(data-label);
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(0, 0, 0, 0.05);
            padding: 0.25rem 0.5rem;
            font-size: 12px;
            border-radius: 4px;
        }

        .demo-box>* {
            background: repeating-linear-gradient(45deg,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.05) 10px,
                    transparent 10px,
                    transparent 20px);
        }

        .grid_layer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: z("guides");
        }

        .grid-status {
            font-size: 0.75rem;
            margin-left: 0.5rem;
            background: #eee;
            color: #444;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
        }
    </style>

<style>
  .layer-demo {
    position: relative;
    height: 400px;
    border: 1px solid #ddd;
    margin-bottom: 2rem;
    background: #f7f7f7;
    overflow: hidden;
  }

  .layer-box {
    position: absolute;
    width: 200px;
    height: 200px;
    padding: 1rem;
    color: white;
    font-weight: bold;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.9;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
  }

  .layer-controls {
    margin-bottom: 1rem;
  }

  .layer-controls button {
    margin-right: 0.5rem;
    padding: 0.25rem 0.75rem;
    font-size: 0.875rem;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
    border-radius: 4px;
  }

  .hidden {
    opacity: 0 !important;
    pointer-events: none;
  }

  .z-guides         { z-index: 9998; background: rgba(0, 200, 255, 0.8); top: 20px; left: 20px; }
  .z-modal          { z-index: 7000; background: rgba(255, 0, 0, 0.8); top: 60px; left: 60px; }
  .z-interface      { z-index: 4000; background: rgba(0, 200, 100, 0.8); top: 100px; left: 100px; }
  .z-content        { z-index: 2000; background: rgba(100, 100, 255, 0.8); top: 140px; left: 140px; }
  .z-canvas         { z-index: -1000; background: rgba(0, 0, 0, 0.2); top: 180px; left: 180px; }
</style>

</head>

<body>

<h1>Layering System Demo</h1>
<p>Demonstrates the z-index stack defined in <code>$layer-map</code>. Use the buttons below to toggle each layer.</p>

    <!-- Grids -->
    <div class="grid_layer guide_graph_centered" data-grid="graph"></div>
    <div class="grid_layer guide_baseline" data-grid="baseline"></div>

    <!-- Buttons -->
    <button data-toggle="baseline">
        ☰ Toggle Baseline <span class="grid-status" data-status="baseline">✓ On</span>
    </button>
    <button data-toggle="graph">
        ⊞ Toggle Graph <span class="grid-status" data-status="graph">✓ On</span>
    </button>
    <button data-toggle="modular">
        ⌘ Toggle Modular <span class="grid-status" data-status="modular">✓ On</span>
    </button>




<div class="layer-controls">
    <button onclick="toggleLayer('guides')">Toggle guides</button>
    <button onclick="toggleLayer('modal')">Toggle modal</button>
    <button onclick="toggleLayer('interface')">Toggle interface</button>
    <button onclick="toggleLayer('content')">Toggle content</button>
    <button onclick="toggleLayer('canvas')">Toggle canvas</button>
</div>

<div class="layer-demo">
    <div class="layer-box z-guides" id="layer-guides">
      guides<br><small>z(guides)</small>
    </div>
    <div class="layer-box z-modal" id="layer-modal">
      modal<br><small>z(modal)</small>
    </div>
    <div class="layer-box z-interface" id="layer-interface">
      interface<br><small>z(interface)</small>
    </div>
    <div class="layer-box z-content" id="layer-content">
      content<br><small>z(content)</small>
    </div>
    <div class="layer-box z-canvas" id="layer-canvas">
      canvas<br><small>z(canvas)</small>
    </div>
</div>

<script>
  function toggleLayer(id) {
    const el = document.getElementById('layer-' + id);
    el.classList.toggle('hidden');
  }
</script>


</body>

</html>
