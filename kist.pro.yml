
---


# =============================================================================
# Options
# =============================================================================

options:

    mode: development
    live:
        enabled: false
        port: 3001
        root: public
        watchPaths:
            - src/**
            - config/**
        ignoredPaths:
            - node_modules/**
    logLevel: debug


# =============================================================================
# Stages
# =============================================================================

stages:

    # Preprocessing
    # =========================================================================
    -
        name: Preprocessing
        description: "Before starting a new build."

        steps:

            # Dirs Clean (tolerant - ignores missing files/dirs)
            # -----------------------------------------------------------------
            -
                name: CleanBuildDirStep
                action: DirectoryCleanAction
                options:
                    dirPath: "./dist"
                    tolerant: true

            # Process SCSS to CSS
            # -----------------------------------------------------------------
            -   name: ProcessMainStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/unit.gl.min.css"
                    styleOption: "compressed"
            -
                name: ProcessAdditionalStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/unit.gl.css"
                    styleOption: "expanded"

            # Process Docs SCSS to CSS (separate from package CSS)
            # -----------------------------------------------------------------
            -   name: ProcessDocsStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/docs.scss"
                    outputFile: "./dist/css/unit.gl.docs.min.css"
                    styleOption: "compressed"
            -
                name: ProcessAdditionalDocsStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/docs.scss"
                    outputFile: "./dist/css/unit.gl.docs.css"
                    styleOption: "expanded"

            # Copy Files
            # -----------------------------------------------------------------
            -
                name: CopyLICENSE
                action: FileCopyAction
                options:
                    srcFile: "./LICENSE"
                    destDir: "./dist"
            -
                name: CopyREADME
                action: FileCopyAction
                options:
                    srcFile: "./README.md"
                    destDir: "./dist"

            # Copy Dirs
            # -----------------------------------------------------------------
            -
                name: CopySrcSCSS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/scss"
                    destDir: "./dist/scss"
            -
                name: CopySrcTS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/ts"
                    destDir: "./dist/ts"

            # RenderTemplates
            # -----------------------------------------------------------------

            -
                name: RenderTemplates
                action: TemplateRenderAction
                options:
                    inputDir: "./src/jinja"
                    outputDir: "./src/html"
                    pattern: "**/*.html.jinja"
                    stripExtension: ".jinja"
                    context:
                        name: "kist"
                        version: "1.0.0"
                        author: "Lars van Vianen"


            # Copy Dirs
            # -----------------------------------------------------------------
            -
                name: CopySrcHTML
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/html"
                    destDir: "./dist/html"

            # Compile TS to JS
            # -----------------------------------------------------------------


            -
                name: Compile TS to JS
                action: TypeScriptCompilerAction
                options:
                    tsConfigPath: "./tsconfig.json"
            -
                name: Rename Library JS Map
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/index.js.map"
                    targetPath: "./dist/js/unit.gl.js.map"

            -
                name: Rename Library JS
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/index.js"
                    targetPath: "./dist/js/unit.gl.js"

            # Compile Docs TS to JS (separate from library)
            # -----------------------------------------------------------------
            # Note: docs.ts is compiled along with index.ts via tsconfig.json
            # This step is commented out as TypeScriptCompilerAction compiles all files
            # -
            #     name: Compile Docs TS to JS
            #     action: TypeScriptCompilerAction
            #     options:
            #         tsConfigPath: "./tsconfig.json"
            -
                name: Rename Docs JS Map
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/docs.js.map"
                    targetPath: "./dist/js/unit.gl.docs.js.map"
            -
                name: Rename Docs JS
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/docs.js"
                    targetPath: "./dist/js/unit.gl.docs.js"

            # Package.json
            # -----------------------------------------------------------------
            -
                name: Package.json
                action: PackageManagerAction
                options:
                    packageJsonPath: "./package.json"
                    outputDir: "./dist"
                    fields:
                        - name
                        - version
                        - bin
                        - dependencies
                        - description
                        - keywords
                        - license
                        - homepage
                        - author
                        - contributors
                        - repository
                        - funding
                        - exports
                    # customConfig:
                    #     private: true
                    #     scripts:
                    #     start: "node index.js"
                    #     build: "npm run build"
                    #     devDependencies:
                    #     typescript: "^5.0.0"

            # Replace Version
            # -----------------------------------------------------------------
            -
                name: ReplaceVersion
                action: VersionWriteAction
                options:
                    files:
                    -   path: "./CITATION.cff"
                        key: "version: "
                    -   path: "./VERSION"
                        key: "v"
