
---


# =============================================================================
# Options
# =============================================================================

options:

    mode: development
    live:
        enabled: false
        port: 3000
        root: public
        watchPaths:
            - src/**
            - config/**
        ignoredPaths:
            - node_modules/**
    logLevel: debug


# =============================================================================
# Stages
# =============================================================================

stages:

    # Preprocessing
    # =========================================================================
    -
        name: Preprocessing
        description: "Before starting a new build."

        steps:


            # Process SCSS to CSS
            # -----------------------------------------------------------------
            -   name: ProcessMainStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/unit.gl.min.css"
                    styleOption: "compressed"
            -
                name: ProcessAdditionalStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/unit.gl.css"
                    styleOption: "expanded"

            # Compile TS to JS
            # -----------------------------------------------------------------


            -
                name: Compile TS to JS
                action: TypeScriptCompilerAction
                options:
                    tsConfigPath: "./tsconfig.pro.json"
                    filePaths:
                        - "src/ts/index.ts"
                        # - "src/utils.ts"
                    outputDir: "./dist/js"
                    compilerOptions:
                        target: "ES2020"
                        module: "CommonJS"
            -
                name: Rename README File
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/index.js.map"
                    targetPath: "./dist/js/unit.gl.js.map"

            -
                name: Rename README File
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/index.js"
                    targetPath: "./dist/js/unit.gl.js"

            # Render Templates
            # -----------------------------------------------------------------

            -
                name: RenderTemplates
                action: TemplateRenderAction
                options:
                    templatesDir: "./src/jinja"
                    outputDir: "./src/html"
                    renderAllFromDir: true
                context:
                    name: "kist"
                    version: "1.0.0"
                    author: "Lars van Vianen"


            # Copy HTML
            # -----------------------------------------------------------------
            -
                name: CopySrcHTML
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/scss"
                    destDir: "./dist/scss"
            -
                name: CopySrcTS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/html"
                    destDir: "./dist/html"

