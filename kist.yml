# =============================================================================
# unit.gl - Production Build Configuration
# =============================================================================

---

options:
    mode: production
    logLevel: info

# =============================================================================
# Stages
# =============================================================================

stages:

    - name: Build
      description: "Production build for unit.gl (unit conversion library)"

      steps:

            # Clean dist directory
            # -----------------------------------------------------------------
            - name: CleanDistDirectory
              action: DirectoryCleanAction
              options:
                  dirPath: "./dist"
                  tolerant: true

            # Note: TypeScript build is handled by npm script after kist runs
            # See package.json: "build": "npx kist ... && npm run build:ts"

            # Process SCSS to CSS (library styles)
            # -----------------------------------------------------------------
            - name: ProcessMainStylesMinified
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/index.scss"
                  outputFile: "./dist/css/unit.gl.min.css"
                  styleOption: "compressed"

            - name: ProcessMainStylesExpanded
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/index.scss"
                  outputFile: "./dist/css/unit.gl.css"
                  styleOption: "expanded"

            # Process Docs SCSS to CSS (documentation styles)
            # -----------------------------------------------------------------
            - name: ProcessDocsStylesMinified
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/docs.scss"
                  outputFile: "./dist/css/unit.gl.docs.min.css"
                  styleOption: "compressed"

            - name: ProcessDocsStylesExpanded
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/docs.scss"
                  outputFile: "./dist/css/unit.gl.docs.css"
                  styleOption: "expanded"

            # Copy source files
            # -----------------------------------------------------------------
            - name: CopySrcSCSS
              action: DirectoryCopyAction
              options:
                  srcDir: "./src/scss"
                  destDir: "./dist/scss"

            - name: CopySrcTS
              action: DirectoryCopyAction
              options:
                  srcDir: "./src/ts"
                  destDir: "./dist/ts"

            # Render templates
            # -----------------------------------------------------------------
            - name: RenderTemplates
              action: TemplateRenderAction
              options:
                  inputDir: "./src/jinja"
                  outputDir: "./src/html"
                  pattern: "**/*.html.jinja"
                  stripExtension: ".jinja"
                  context:
                      name: "unit.gl"
                      version: "1.0.0"
                      author: "Lars van Vianen"

            - name: CopySrcHTML
              action: DirectoryCopyAction
              options:
                  srcDir: "./src/html"
                  destDir: "./dist/html"

            # Copy license and readme
            # -----------------------------------------------------------------
            - name: CopyLICENSE
              action: FileCopyAction
              options:
                  srcFile: "./LICENSE"
                  destDir: "./dist"

            - name: CopyREADME
              action: FileCopyAction
              options:
                  srcFile: "./README.md"
                  destDir: "./dist"

            # Generate package.json for distribution
            # -----------------------------------------------------------------
            - name: GeneratePackageJSON
              action: PackageManagerAction
              options:
                  packageJsonPath: "./package.json"
                  outputDir: "./dist"
                  fields:
                      - name
                      - version
                      - bin
                      - dependencies
                      - description
                      - keywords
                      - license
                      - homepage
                      - author
                      - contributors
                      - repository
                      - funding
                      - exports

            # Version synchronization
            # -----------------------------------------------------------------
            - name: SyncVersion
              action: VersionWriteAction
              options:
                  files:
                      - path: "./CITATION.cff"
                        key: "version: "
                      - path: "./VERSION"
                        key: "v"
